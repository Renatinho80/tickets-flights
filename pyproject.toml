[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flight-analyst"
version = "0.1.0"
description = "Analista pessoal de passagens aéreas — inteligência de preços, sazonalidade e janela de compra"
readme = "README.md"
requires-python = ">=3.10"

# Dependências mínimas — presentes em todas as fases
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.26",
    "pyyaml>=6.0",
    "structlog>=24.0",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "rich>=13.0",
    "sentry-sdk>=1.40",
    "tenacity>=8.2",
    "nest_asyncio>=1.6",
    "airportsdata>=20240101",
]

[project.optional-dependencies]
# Fase 1 — coleta e armazenamento
phase1 = [
    "postgrest>=0.16.0",
    "aiosqlite>=0.19",
    "playwright>=1.40",
    "playwright-stealth>=1.0",
]

# Fase 2 — motor de inteligência
phase2 = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "pandas>=2.0",
    "statsmodels>=0.14",
    "numpy>=1.26",
    "scipy>=1.12",
    "google-generativeai>=0.5",
]

# Fase 3 — scheduler e notificações
phase3 = [
    "inngest>=0.3",
    "python-telegram-bot>=20.0",
    "apscheduler>=3.10",
]

# Fase 4 — dashboard
phase4 = [
    "streamlit>=1.32",
    "plotly>=5.20",
    "altair>=5.0",
]

# Dev — tooling e testes
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "mypy>=1.8",
    "ruff>=0.3",
]

# Tudo junto (para deploy completo)
all = [
    "flight-analyst[phase1,phase2,phase3,phase4]",
]

[project.scripts]
flight-analyst = "flight_analyst.main:main"


[tool.ruff]
target-version = "py310"
line-length = 100
select = ["E", "W", "F", "I", "UP", "B", "C4", "PTH"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.envs.default]
dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "mypy>=1.8",
    "ruff>=0.3",
]
